<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일일 Check LIST</title>
  <!-- FullCalendar CDN -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body { max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; }
    h1 { text-align: center; color: #333; }
    
    /* 탭 메뉴 */
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none; background: #e9ecef; cursor: pointer; border-radius: 8px; }
    .tab-btn.active { background: #4C6EF5; color: white; }
    
    /* 탭 콘텐츠 영역 */
    .tab-content { display: none; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .tab-content.active { display: block; }

    /* 폼 스타일 */
    .form-group { margin-bottom: 20px; }
    .form-group > label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 16px; }
    .required-tag { color: #e03131; margin-left: 4px; }
    .input-row { display: flex; gap: 8px; }
    .input-col { flex: 1; }
    .input-col label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; }
    .submit-btn { width: 100%; padding: 14px; background: #4C6EF5; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .submit-btn:disabled { background: #adb5bd; }

    /* 달력 커스텀 */
    #calendar { max-width: 100%; margin: 0 auto; }
    .fc-event { cursor: pointer; }

    /* 모달 팝업 */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 10% auto; padding: 24px; width: 90%; max-width: 480px; border-radius: 12px; max-height: 80vh; overflow-y: auto; }
    .modal-content h3 { margin-top: 0; border-bottom: 2px solid #4C6EF5; padding-bottom: 10px; }
    .modal-section { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
    .modal-section-title { font-weight: bold; color: #4C6EF5; margin-bottom: 4px; }
    .modal-item { margin: 4px 0; font-size: 14px; color: #495057; }
    .close-btn { width: 100%; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 6px; margin-top: 15px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🏥 일일 건강 기록장</h1>

  <!-- 탭 버튼 -->
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('register')">📝 데이터 입력</button>
    <button class="tab-btn" onclick="switchTab('calendar-tab')">📅 달력 보기</button>
  </div>

  <!-- 1. 등록 폼 탭 -->
  <div id="register" class="tab-content active">
    <form id="healthForm">
      <div class="form-group">
        <label>날짜<span class="required-tag">*</span></label>
        <input type="date" id="datetime" required>
      </div>

      <!-- 1. 체온 (필수 항목) -->
      <div class="form-group">
        <label>1. 체온 (℃)<span class="required-tag">* (최소 1개 작성)</span></label>
        <div class="input-row">
          <div class="input-col"><label>아침</label><input type="number" step="0.1" id="temp_m" placeholder="36.5"></div>
          <div class="input-col"><label>점심</label><input type="number" step="0.1" id="temp_a" placeholder="36.6"></div>
          <div class="input-col"><label>저녁</label><input type="number" step="0.1" id="temp_e" placeholder="36.5"></div>
        </div>
      </div>

      <!-- 2. 식사량 (필수 항목) -->
      <div class="form-group">
        <label>2. 식사량<span class="required-tag">* (최소 1개 작성)</span></label>
        <div class="input-row">
          <div class="input-col"><label>아침</label><input type="text" id="meal_m" placeholder="일반식 1공기"></div>
          <div class="input-col"><label>점심</label><input type="text" id="meal_a" placeholder="죽 1/2공기"></div>
          <div class="input-col"><label>저녁</label><input type="text" id="meal_e" placeholder="금식/음료"></div>
        </div>
      </div>

      <!-- 3. 혈압 / 맥박 (필수 항목) -->
      <div class="form-group">
        <label>3. 혈압 / 맥박<span class="required-tag">* (최소 1개 작성)</span></label>
        <div class="input-row">
          <div class="input-col"><label>아침</label><input type="text" id="bp_m" placeholder="120/80-72"></div>
          <div class="input-col"><label>점심</label><input type="text" id="bp_a" placeholder="122/82-75"></div>
          <div class="input-col"><label>저녁</label><input type="text" id="bp_e" placeholder="118/78-70"></div>
        </div>
      </div>

      <!-- 기타 선택 항목들 -->
      <div class="form-group">
        <label>물 섭취량 (ml)</label>
        <input type="number" id="water" placeholder="예: 1500">
      </div>
      <div class="form-group">
        <label>소변 (횟수/상태)</label>
        <input type="text" id="urine" placeholder="예: 5회 / 보통">
      </div>
      <div class="form-group">
        <label>설사/구토 횟수</label>
        <input type="text" id="vomit_diarrhea" placeholder="예: 구토 0회, 설사 1회">
      </div>
      <div class="form-group">
        <label>기타 특이사항</label>
        <textarea id="note" rows="3" placeholder="두통 살짝 있음"></textarea>
      </div>
      <button type="submit" id="saveBtn" class="submit-btn">기록 저장하기</button>
    </form>
  </div>

  <!-- 2. 달력 탭 -->
  <div id="calendar-tab" class="tab-content">
    <div id="calendar"></div>
  </div>

  <!-- 상세 정보 모달 팝업 -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <h3 id="modalDate">상세 기록</h3>
      <div id="modalBody"></div>
      <button class="close-btn" onclick="closeModal()">닫기</button>
    </div>
  </div>

  <script>
    // ⚠️ [중요] 본인의 Google Apps Script 웹 앱 URL로 입력해주세요.
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxfLyOaPvmXJ8YnvktBFFXvSHpe9W9W3QCWrsGMliYJCDDm94dn6mwhoYa5e0VlYBzljw/exec";

    let calendarObj = null;

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('datetime').value = getTodayString();
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabId === 'register') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('register').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('calendar-tab').classList.add('active');
        
        if (!calendarObj) {
          initCalendar();
        } else {
          calendarObj.refetchEvents();
        }
      }
    }

    // 폼 검증 (체온, 식사량, 혈압/맥박 각각 최소 1개 입력 여부 확인)
    function validateForm() {
      const tempM = document.getElementById('temp_m').value;
      const tempA = document.getElementById('temp_a').value;
      const tempE = document.getElementById('temp_e').value;
      if (!tempM && !tempA && !tempE) {
        alert('체온(아침, 점심, 저녁 중 최소 하나)을 입력해주세요.');
        return false;
      }

      const mealM = document.getElementById('meal_m').value;
      const mealA = document.getElementById('meal_a').value;
      const mealE = document.getElementById('meal_e').value;
      if (!mealM && !mealA && !mealE) {
        alert('식사량(아침, 점심, 저녁 중 최소 하나)을 입력해주세요.');
        return false;
      }

      const bpM = document.getElementById('bp_m').value;
      const bpA = document.getElementById('bp_a').value;
      const bpE = document.getElementById('bp_e').value;
      if (!bpM && !bpA && !bpE) {
        alert('혈압/맥박(아침, 점심, 저녁 중 최소 하나)을 입력해주세요.');
        return false;
      }

      return true;
    }

    // 데이터 저장 (POST)
    document.getElementById('healthForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (!validateForm()) return;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = '저장 중...';

      const payload = {
        datetime: document.getElementById('datetime').value,
        temp_m: document.getElementById('temp_m').value,
        temp_a: document.getElementById('temp_a').value,
        temp_e: document.getElementById('temp_e').value,
        meal_m: document.getElementById('meal_m').value,
        meal_a: document.getElementById('meal_a').value,
        meal_e: document.getElementById('meal_e').value,
        bp_m: document.getElementById('bp_m').value,
        bp_a: document.getElementById('bp_a').value,
        bp_e: document.getElementById('bp_e').value,
        water: document.getElementById('water').value,
        urine: document.getElementById('urine').value,
        vomit_diarrhea: document.getElementById('vomit_diarrhea').value,
        note: document.getElementById('note').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert('기록이 성공적으로 저장되었습니다!');
        document.getElementById('healthForm').reset();
        document.getElementById('datetime').value = getTodayString();
      })
      .catch(err => {
        alert('저장 실패: ' + err);
      })
      .finally(() => {
        saveBtn.disabled = false;
        saveBtn.innerText = '기록 저장하기';
      });
    });

    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      calendarObj = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ko',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },
        events: function(fetchInfo, successCallback, failureCallback) {
          fetch(GAS_URL)
            .then(res => res.json())
            .then(data => successCallback(data))
            .catch(err => failureCallback(err));
        },
        eventClick: function(info) {
          showDetail(info.event);
        }
      });
      calendarObj.render();
    }

    // 상세 정보 모달 출력
    function showDetail(event) {
      const p = event.extendedProps;
      const rawDateStr = p.datetime ? String(p.datetime).substring(0, 10) : event.startStr;

      const html = `
        <div class="modal-section">
          <div class="modal-section-title">🌡️ 체온</div>
          <div class="modal-item">아침: ${p.temp_m ? p.temp_m + ' ℃' : '-'} | 점심: ${p.temp_a ? p.temp_a + ' ℃' : '-'} | 저녁: ${p.temp_e ? p.temp_e + ' ℃' : '-'}</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">🥣 식사량</div>
          <div class="modal-item">아침: ${p.meal_m || '-'}</div>
          <div class="modal-item">점심: ${p.meal_a || '-'}</div>
          <div class="modal-item">저녁: ${p.meal_e || '-'}</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">💓 혈압/맥박</div>
          <div class="modal-item">아침: ${p.bp_m || '-'}</div>
          <div class="modal-item">점심: ${p.bp_a || '-'}</div>
          <div class="modal-item">저녁: ${p.bp_e || '-'}</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-title">💧 기타 기록</div>
          <div class="modal-item"><b>물 섭취량:</b> ${p.water ? p.water + ' ml' : '-'}</div>
          <div class="modal-item"><b>소변:</b> ${p.urine || '-'}</div>
          <div class="modal-item"><b>설사/구토:</b> ${p.vomit_diarrhea || '-'}</div>
          <div class="modal-item"><b>특이사항:</b> ${p.note || '-'}</div>
        </div>
      `;
      document.getElementById('modalDate').innerText = rawDateStr + " 건강 기록";
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('detailModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }
  </script>
</body>
</html>
